<!-- @dsCard group="Colors" viewport="700x160" subtitle="Estados de sistema — sucesso, atenção, erro" name="Semânticas" -->
<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:20px;background:var(--color-surface)">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;font-family:var(--font-body)">
  <div style="border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--color-border)">
    <div style="height:56px;background:var(--success-500)"></div>
    <div style="height:24px;background:var(--success-50)"></div>
    <div style="padding:8px 10px"><div style="font-family:var(--font-display);font-weight:700;font-size:13px">Sucesso</div><div style="font-size:11px;color:var(--color-text-muted)">#16a35a</div></div>
  </div>
  <div style="border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--color-border)">
    <div style="height:56px;background:var(--warning-500)"></div>
    <div style="height:24px;background:var(--warning-50)"></div>
    <div style="padding:8px 10px"><div style="font-family:var(--font-display);font-weight:700;font-size:13px">Atenção</div><div style="font-size:11px;color:var(--color-text-muted)">#f5a623</div></div>
  </div>
  <div style="border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--color-border)">
    <div style="height:56px;background:var(--danger-500)"></div>
    <div style="height:24px;background:var(--danger-50)"></div>
    <div style="padding:8px 10px"><div style="font-family:var(--font-display);font-weight:700;font-size:13px">Erro</div><div style="font-size:11px;color:var(--color-text-muted)">#e02424</div></div>
  </div>
</div>
</body></html>
