<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:20px;background:var(--color-surface)">
<div style="display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--color-border)">
  <div style="flex:1;background:var(--neutral-0);height:96px"></div>
  <div style="flex:1;background:var(--neutral-50);height:96px"></div>
  <div style="flex:1;background:var(--neutral-100);height:96px"></div>
  <div style="flex:1;background:var(--neutral-200);height:96px"></div>
  <div style="flex:1;background:var(--neutral-300);height:96px"></div>
  <div style="flex:1;background:var(--neutral-400);height:96px"></div>
  <div style="flex:1;background:var(--neutral-500);height:96px"></div>
  <div style="flex:1;background:var(--neutral-600);height:96px"></div>
  <div style="flex:1;background:var(--neutral-700);height:96px"></div>
  <div style="flex:1;background:var(--neutral-800);height:96px"></div>
  <div style="flex:1;background:var(--neutral-900);height:96px"></div>
  <div style="flex:1;background:var(--neutral-950);height:96px"></div>
</div>
<div style="display:flex;justify-content:space-between;margin-top:8px;font-family:var(--font-body);font-size:11px;color:var(--color-text-muted)">
  <span>0</span><span>50</span><span>100</span><span>200</span><span>300</span><span>400</span><span>500</span><span>600</span><span>700</span><span>800</span><span>900</span><span>950</span>
</div>
</body></html>
