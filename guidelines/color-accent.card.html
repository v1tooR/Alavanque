<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:20px;background:var(--color-surface)">
<div style="display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)">
  <div style="flex:1;background:var(--orange-50);height:96px"></div>
  <div style="flex:1;background:var(--orange-100);height:96px"></div>
  <div style="flex:1;background:var(--orange-200);height:96px"></div>
  <div style="flex:1;background:var(--orange-300);height:96px"></div>
  <div style="flex:1;background:var(--orange-400);height:96px"></div>
  <div style="flex:1;background:var(--orange-500);height:96px;position:relative"><span style="position:absolute;bottom:8px;left:8px;color:#fff;font-family:var(--font-display);font-weight:700;font-size:11px">500</span></div>

  <div style="flex:1;background:var(--orange-700);height:96px"></div>
  <div style="flex:1;background:var(--orange-800);height:96px"></div>
  <div style="flex:1;background:var(--orange-900);height:96px"></div>
</div>
<div style="display:flex;justify-content:space-between;margin-top:8px;font-family:var(--font-body);font-size:11px;color:var(--color-text-muted)">
  <span>50</span><span>100</span><span>200</span><span>300</span><span>400</span><span style="color:var(--color-accent);font-weight:700">#ff5f19</span><span>600</span><span>700</span><span>800</span><span>900</span>
