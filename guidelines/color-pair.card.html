<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:0;background:var(--color-surface)">
<div style="display:flex;height:170px;font-family:var(--font-display)">
  <div style="flex:1.6;background:var(--color-primary);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:18px">
    <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;font-family:var(--font-body);font-weight:600">Primária</div>
    <div style="font-weight:800;font-size:22px">Azul #006098</div>
    <div style="font-size:12px;opacity:.85;font-family:var(--font-body)">Confiança, engenharia, estrutura</div>
  </div>
  <div style="flex:1;background:var(--color-accent);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:18px">
    <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.9;font-family:var(--font-body);font-weight:600">Acento</div>
    <div style="font-weight:800;font-size:22px">#ff5f19</div>
    <div style="font-size:12px;opacity:.95;font-family:var(--font-body)">Energia, ação, CTA</div>
  </div>
</div>
</body></html>
