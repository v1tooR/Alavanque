<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Grade base 4px — escala de espaçamento" name="Espaçamento" -->
<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:24px;background:var(--color-surface);font-family:var(--font-body)">
<div style="display:flex;align-items:flex-end;gap:16px">
  <div style="text-align:center"><div style="width:4px;height:var(--space-1);background:var(--color-primary);margin:0 auto"></div><div style="font-size:10px;color:var(--color-text-muted);margin-top:6px">1</div></div>
  <div style="text-align:center"><div style="width:8px;height:var(--space-2);background:var(--color-primary);margin:0 auto"></div><div style="font-size:10px;color:var(--color-text-muted);margin-top:6px">2</div></div>
  <div style="text-align:center"><div style="width:12px;height:var(--space-3);background:var(--color-primary);margin:0 auto"></div><div style="font-size:10px;color:var(--color-text-muted);margin-top:6px">3</div></div>
  <div style="text-align:center"><div style="width:16px;height:var(--space-4);background:var(--color-primary);margin:0 auto"></div><div style="font-size:10px;color:var(--color-text-muted);margin-top:6px">4</div></div>
  <div style="text-align:center"><div style="width:24px;height:var(--space-6);background:var(--color-primary);margin:0 auto"></div><div style="font-size:10px;color:var(--color-text-muted);margin-top:6px">6</div></div>
  <div style="text-align:center"><div style="width:32px;height:var(--space-8);background:var(--color-primary);margin:0 auto"></div><div style="font-size:10px;color:var(--color-text-muted);margin-top:6px">8</div></div>
  <div style="text-align:center"><div style="width:48px;height:var(--space-12);background:var(--color-primary);margin:0 auto"></div><div style="font-size:10px;color:var(--color-text-muted);margin-top:6px">12</div></div>
  <div style="text-align:center"><div style="width:64px;height:var(--space-16);background:var(--color-primary);margin:0 auto"></div><div style="font-size:10px;color:var(--color-text-muted);margin-top:6px">16</div></div>
</div>
</body></html>
