<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Elevação suave + brilhos de marca no CTA" name="Sombras" -->
<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:28px 24px;background:var(--color-bg);font-family:var(--font-body)">
<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap">
  <div style="text-align:center"><div style="width:84px;height:64px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-sm)"></div><div style="font-size:11px;color:var(--color-text-muted);margin-top:8px">sm</div></div>
  <div style="text-align:center"><div style="width:84px;height:64px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-md)"></div><div style="font-size:11px;color:var(--color-text-muted);margin-top:8px">md</div></div>
  <div style="text-align:center"><div style="width:84px;height:64px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-lg)"></div><div style="font-size:11px;color:var(--color-text-muted);margin-top:8px">lg</div></div>
  <div style="text-align:center"><div style="width:84px;height:64px;background:var(--color-accent);border-radius:var(--radius-md);box-shadow:var(--shadow-accent)"></div><div style="font-size:11px;color:var(--color-text-muted);margin-top:8px">accent</div></div>
  <div style="text-align:center"><div style="width:84px;height:64px;background:var(--color-primary);border-radius:var(--radius-md);box-shadow:var(--shadow-primary)"></div><div style="font-size:11px;color:var(--color-text-muted);margin-top:8px">primary</div></div>
</div>
</body></html>
