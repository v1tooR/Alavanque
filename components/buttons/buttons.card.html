<!-- @dsCard group="Components" viewport="700x300" subtitle="Variantes, tamanhos e estados — CTA laranja em destaque" name="Botões" -->
<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body style="padding:28px;background:var(--color-surface)">
<div id="root"></div>
<script type="text/babel" data-presets="react">
const NS = Object.values(window).find(v=>v&&typeof v==='object'&&typeof v.Button==='function')||{};
const { Button } = NS;
const Arrow = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>;
const Row = ({children}) => <div style={{display:'flex',gap:14,alignItems:'center',flexWrap:'wrap',marginBottom:18}}>{children}</div>;
ReactDOM.createRoot(document.getElementById('root')).render(
  <>
    <Row>
      <Button variant="accent" iconRight={<Arrow/>}>Solicitar cotação</Button>
      <Button variant="primary">Ver produtos</Button>
      <Button variant="secondary">Assistir vídeo</Button>
      <Button variant="ghost">Ver itens adicionais</Button>
      <Button variant="danger">Remover</Button>
    </Row>
    <Row>
      <Button variant="accent" size="sm">Pequeno</Button>
      <Button variant="accent" size="md">Médio</Button>
      <Button variant="accent" size="lg">Grande</Button>
      <Button variant="primary" disabled>Desabilitado</Button>
    </Row>
    <div style={{maxWidth:360}}><Button variant="accent" block iconRight={<Arrow/>}>Solicitar cotação no WhatsApp</Button></div>
  </>
);
</script>
</body></html>
