<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script src="../../_ds_bundle.js"></script>

<body style="padding:28px;background:var(--color-surface)">

const NS = Object.values(window).find(v=>v&&typeof v==='object'&&typeof v.Button==='function')||{};
const { Table } = NS;
ReactDOM.createRoot(document.getElementById('root')).render(
  <Table
    columns={[{key:'attr',label:'Especificação'},{key:'val',label:'Valor',align:'right'}]}
    rows={[
      {attr:'Altura',val:'60 cm'},
      {attr:'Largura',val:'45 cm'},
      {attr:'Peso',val:'32 kg'},
      {attr:'Capacidade do cilindro',val:'5 litros'},
      {attr:'Peso dos produtos',val:'7g a 120g'},
      {attr:'Tipo',val:'Máquina de bancada'},
    ]}
  />
);
</script>
</body></html>
